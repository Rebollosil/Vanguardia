<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro - Vanguardia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card shadow p-4" style="width: 400px; border-radius: 10px;">
        <div class="card-body">
            <h3 class="card-title text-center mb-4 fw-bold">Crear Cuenta</h3>
            
            <form th:action="@{/registro}" th:object="${usuario}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Nombre de Usuario</label>
                    <input type="text" th:field="*{username}" class="form-control" id="username" required>
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" th:field="*{password}" class="form-control" id="password" required>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 fw-bold">Registrarse</button>
            </form>
            
            <div class="text-center mt-3">
                <a th:href="@{/login}" class="text-decoration-none small">¿Ya tienes cuenta? Inicia Sesión</a>
            </div>
        </div>
    </div>

</body>
</html>
